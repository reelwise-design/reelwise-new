<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reelwise — Know the Movie. Know the Story.</title>

<style>

:root{
  --bg:#07090d;
  --panel:#11151d;
  --panel2:#171c25;
  --line:#29313d;
  --text:#f5f7fa;
  --muted:#929baa;
  --gold:#e7b84f;
  --orange:#ff5a36;
  --white:#ffffff;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% -10%,#222b39 0,#0d1118 32%,#07090d 70%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  min-height:100vh;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(7,9,13,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.nav{
  max-width:1180px;
  margin:auto;
  min-height:72px;
  padding:0 22px;
  display:flex;
  align-items:center;
  gap:30px;
}

.logo{
  font-size:27px;
  font-weight:900;
  letter-spacing:-1.2px;
  cursor:pointer;
  white-space:nowrap;
}

.logo span{
  color:var(--orange);
}

.navlinks{
  display:flex;
  gap:8px;
}

.navlinks button{
  background:none;
  border:0;
  color:#b5bdc9;
  padding:10px 13px;
  border-radius:8px;
  font-weight:700;
}

.navlinks button:hover{
  color:white;
  background:#171c24;
}

.search{
  margin-left:auto;
  display:flex;
  gap:8px;
}

.search input{
  width:270px;
  background:#131820;
  border:1px solid #303946;
  color:white;
  border-radius:10px;
  padding:11px 13px;
  outline:none;
}

.search input:focus{
  border-color:var(--orange);
}

.search button{
  border:0;
  background:var(--orange);
  color:white;
  border-radius:10px;
  padding:11px 16px;
  font-weight:900;
}

/* =========================
   GENERAL
========================= */

.wrap{
  max-width:1180px;
  margin:auto;
  padding:0 22px;
}

.page{
  padding:45px 0 75px;
}

.eyebrow{
  color:var(--gold);
  font-size:12px;
  font-weight:900;
  letter-spacing:2.2px;
}

.muted{
  color:var(--muted);
}

/* =========================
   HERO
========================= */

.hero{
  min-height:570px;
  display:grid;
  grid-template-columns:1.25fr .75fr;
  gap:45px;
  align-items:center;
  padding:65px 0 60px;
}

.hero h1{
  margin:12px 0 22px;
  font-size:clamp(50px,7vw,86px);
  line-height:.94;
  letter-spacing:-4px;
}

.hero h1 span{
  color:var(--orange);
}

.hero p{
  max-width:680px;
  color:#aeb6c2;
  font-size:20px;
  line-height:1.65;
}

.hero-actions{
  display:flex;
  gap:12px;
  margin-top:30px;
  flex-wrap:wrap;
}

.primary{
  border:0;
  background:var(--orange);
  color:white;
  padding:14px 20px;
  border-radius:10px;
  font-weight:900;
}

.secondary{
  border:1px solid #37404d;
  background:#151a22;
  color:white;
  padding:14px 20px;
  border-radius:10px;
  font-weight:800;
}

.hero-story{
  min-height:350px;
  border:1px solid #303846;
  border-radius:22px;
  padding:30px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  background:
    linear-gradient(145deg,rgba(38,48,63,.95),rgba(13,17,23,.98)),
    radial-gradient(circle at 80% 20%,#4d2630,transparent 40%);
  box-shadow:0 25px 80px rgba(0,0,0,.35);
}

.hero-story .mark{
  font-size:48px;
  margin-bottom:auto;
}

.hero-story h3{
  font-size:27px;
  line-height:1.2;
  margin:10px 0;
}

/* =========================
   FEATURE STRIP
========================= */

.feature-strip{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:65px;
}

.feature{
  min-height:180px;
  padding:23px;
  background:linear-gradient(145deg,#171c25,#10141a);
  border:1px solid var(--line);
  border-radius:16px;
  transition:.2s;
}

.feature:hover{
  transform:translateY(-4px);
  border-color:#465161;
}

.feature-icon{
  font-size:30px;
  margin-bottom:18px;
}

.feature h3{
  margin:0 0 8px;
  font-size:20px;
}

.feature p{
  margin:0;
  color:var(--muted);
  line-height:1.5;
}

/* =========================
   SECTIONS
========================= */

.section{
  padding:25px 0 55px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:20px;
}

.section h2{
  font-size:30px;
  margin:5px 0;
}

.section-sub{
  color:var(--muted);
}

/* =========================
   MOVIE CARDS
========================= */

.movie-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:16px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  overflow:hidden;
  transition:.2s;
  cursor:pointer;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#505b6c;
  box-shadow:0 14px 35px rgba(0,0,0,.3);
}

.poster{
  aspect-ratio:2/3;
  background:
    linear-gradient(145deg,#334154,#131821);
  display:flex;
  align-items:flex-end;
  padding:16px;
  font-size:21px;
  font-weight:900;
  line-height:1.15;
}

.poster span{
  text-shadow:0 2px 10px rgba(0,0,0,.8);
}

.info{
  padding:14px;
}

.info b{
  display:block;
  font-size:16px;
  margin-bottom:5px;
}

.info small{
  color:var(--muted);
}

/* =========================
   SEARCH
========================= */

.search-page{
  padding:50px 0 75px;
}

.search-heading{
  margin-bottom:30px;
}

.search-heading h1{
  font-size:46px;
  margin:8px 0;
  letter-spacing:-2px;
}

.results-section{
  margin-top:30px;
}

.results-section h2{
  margin-bottom:16px;
}

.result-movie-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:16px;
}

.star-result{
  display:flex;
  align-items:center;
  gap:18px;
  padding:18px;
  margin-bottom:12px;
  background:linear-gradient(145deg,#171d26,#11151c);
  border:1px solid var(--line);
  border-radius:15px;
  cursor:pointer;
  transition:.2s;
}

.star-result:hover{
  border-color:#515d6d;
  transform:translateY(-2px);
}

.star-avatar{
  width:68px;
  height:68px;
  border-radius:50%;
  background:linear-gradient(145deg,#3b4759,#171c24);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  flex:none;
}

.star-result h3{
  margin:0 0 4px;
}

.star-result p{
  margin:0;
  color:var(--muted);
}

.no-results{
  padding:50px 25px;
  text-align:center;
  border:1px dashed #3b4451;
  border-radius:15px;
  color:var(--muted);
}

/* =========================
   DETAIL PAGES
========================= */

.detail{
  display:grid;
  grid-template-columns:290px 1fr;
  gap:38px;
}

.detail-poster{
  aspect-ratio:2/3;
  border-radius:18px;
  background:linear-gradient(145deg,#36475b,#12161d);
  display:flex;
  align-items:flex-end;
  padding:25px;
  font-size:31px;
  font-weight:900;
  line-height:1.05;
}

.detail h1{
  font-size:clamp(42px,6vw,68px);
  letter-spacing:-3px;
  line-height:.95;
  margin:10px 0;
}

.detail-description{
  color:#aab2be;
  font-size:18px;
  line-height:1.6;
  max-width:780px;
}

.facts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:25px 0;
}

.fact{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:11px;
  padding:15px;
}

.fact b{
  display:block;
  font-size:18px;
}

.fact small{
  color:var(--muted);
}

.detail-feature{
  background:linear-gradient(145deg,#191f28,#11151c);
  border:1px solid var(--line);
  border-left:4px solid var(--orange);
  border-radius:15px;
  padding:24px;
  margin:25px 0;
}

.detail-feature h3{
  font-size:23px;
  line-height:1.35;
}

.cast{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.cast button{
  border:1px solid #34404e;
  background:#151b23;
  color:white;
  padding:9px 12px;
  border-radius:8px;
}

.cast button:hover{
  border-color:var(--orange);
}

/* =========================
   STAR PAGE
========================= */

.star-hero{
  padding:45px 0 30px;
}

.star-hero h1{
  font-size:clamp(45px,7vw,76px);
  letter-spacing:-3px;
  margin:8px 0;
}

.star-meta{
  color:var(--muted);
  font-size:17px;
}

.star-section{
  padding:30px 0;
}

.filmography{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.film{
  padding:17px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
}

.film b{
  display:block;
}

.film small{
  color:var(--muted);
}

/* =========================
   DIFFERENCE
========================= */

.difference{
  margin:20px 0 65px;
  padding:40px;
  border:1px solid #303846;
  border-radius:20px;
  background:
    radial-gradient(circle at 100% 0,#252c39,transparent 50%),
    #12171f;
}

.difference h2{
  font-size:34px;
  margin:8px 0 12px;
  max-width:700px;
}

.difference p{
  color:var(--muted);
  max-width:760px;
  font-size:17px;
  line-height:1.6;
}

/* =========================
   FOOTER
========================= */

footer{
  border-top:1px solid #202731;
  margin-top:30px;
  padding:35px 22px;
  text-align:center;
  color:#687281;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  .nav{
    flex-wrap:wrap;
    padding-top:12px;
    padding-bottom:12px;
  }

  .navlinks{
    display:none;
  }

  .search{
    width:100%;
    margin-left:0;
  }

  .search input{
    flex:1;
    width:auto;
  }

  .hero{
    grid-template-columns:1fr;
    padding-top:40px;
  }

  .hero-story{
    min-height:280px;
  }

  .feature-strip{
    grid-template-columns:repeat(2,1fr);
  }

  .movie-grid,
  .result-movie-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .detail{
    grid-template-columns:1fr;
  }

  .detail-poster{
    max-width:280px;
  }

  .filmography{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:520px){

  .logo{
    font-size:23px;
  }

  .search button{
    padding:10px 12px;
  }

  .hero h1{
    font-size:51px;
  }

  .hero p{
    font-size:17px;
  }

  .feature-strip{
    grid-template-columns:1fr 1fr;
  }

  .feature{
    min-height:155px;
    padding:17px;
  }

  .feature h3{
    font-size:17px;
  }

  .feature p{
    font-size:13px;
  }

  .movie-grid,
  .result-movie-grid{
    grid-template-columns:1fr 1fr;
  }

  .poster{
    font-size:17px;
    padding:12px;
  }

  .detail h1{
    font-size:43px;
  }

  .facts{
    grid-template-columns:1fr 1fr 1fr;
  }

  .filmography{
    grid-template-columns:1fr;
  }
}

</style>
</head>

<body>

<header>
  <div class="nav">

    <div class="logo" onclick="home()">
      reel<span>wise</span>
    </div>

    <div class="navlinks">
      <button onclick="home()">Home</button>
      <button onclick="discover()">Discover</button>
      <button onclick="showStars()">Stars</button>
      <button onclick="showStories()">Stories</button>
    </div>

    <form class="search" id="searchForm">
      <input
        id="searchInput"
        autocomplete="off"
        placeholder="Search movies or stars…"
      >
      <button type="submit">Search</button>
    </form>

  </div>
</header>

<main id="app"></main>

<footer>
  Reelwise · Know the movie. Know the story.
</footer>


<script>

/* =========================================================
   REELWISE
   HOMEPAGE + SEARCH EXPERIENCE

   IMPORTANT:
   Movie and actor searches use the existing
   /api/search endpoint.

   Rocky 3 / Rocky 2 normalization is handled
   by the API we just installed.
========================================================= */


/* =========================================================
   SMALL FEATURED MOVIE LIST

   This is NOT the movie database.

   It simply gives the homepage some personality
   before somebody searches.
========================================================= */

const FEATURED_MOVIES = [

  {
    id:"238",
    title:"The Godfather",
    year:"1972",
    genre:"Crime · Drama",
    icon:"🍊"
  },

  {
    id:"240",
    title:"The Godfather Part II",
    year:"1974",
    genre:"Crime · Drama",
    icon:"🎬"
  },

  {
    id:"1371",
    title:"Rocky",
    year:"1976",
    genre:"Drama · Sports",
    icon:"🥊"
  },

  {
    id:"1374",
    title:"Rocky III",
    year:"1982",
    genre:"Drama · Sports",
    icon:"🥊"
  },

  {
    id:"744",
    title:"Top Gun",
    year:"1986",
    genre:"Action · Drama",
    icon:"✈️"
  },

  {
    id:"640",
    title:"Catch Me If You Can",
    year:"2002",
    genre:"Crime · Drama",
    icon:"🕵️"
  },

  {
    id:"8363",
    title:"Superbad",
    year:"2007",
    genre:"Comedy",
    icon:"😂"
  },

  {
    id:"106646",
    title:"The Wolf of Wall Street",
    year:"2013",
    genre:"Crime · Drama",
    icon:"💰"
  }

];


/* =========================================================
   HOME
========================================================= */

function home(){

  app.innerHTML = `

    <div class="wrap">

      <section class="hero">

        <div>

          <div class="eyebrow">
            MOVIES · STARS · QUOTES · STORIES
          </div>

          <h1>
            Know the movie.<br>
            <span>Know the story.</span>
          </h1>

          <p>
            Reelwise goes beyond the credits.
            Discover the quotes, celebrities,
            behind-the-scenes stories, surprising
            facts and connections that make movies
            worth talking about.
          </p>

          <div class="hero-actions">

            <button
              class="primary"
              onclick="focusSearch()"
            >
              🔎 Search Reelwise
            </button>

            <button
              class="secondary"
              onclick="discover()"
            >
              Explore Movies →
            </button>

          </div>

        </div>


        <div class="hero-story">

          <div class="mark">🎬</div>

          <div class="eyebrow">
            THIS IS REELWISE
          </div>

          <h3>
            The movie is only the beginning.
          </h3>

          <p class="muted">
            Follow a movie to its stars.
            Follow a star to another movie.
            Then discover the story you never knew.
          </p>

        </div>

      </section>


      <section class="feature-strip">

        <div class="feature"
             onclick="showFeature('quotes')">

          <div class="feature-icon">💬</div>

          <h3>Quotes</h3>

          <p>
            The lines everybody remembers.
          </p>

        </div>


        <div class="feature"
             onclick="showFeature('stats')">

          <div class="feature-icon">📊</div>

          <h3>Movie Stats</h3>

          <p>
            Release, runtime, genres,
            budget and more.
          </p>

        </div>


        <div class="feature"
             onclick="showFeature('trivia')">

          <div class="feature-icon">🧠</div>

          <h3>Trivia</h3>

          <p>
            Stories and facts behind the movie.
          </p>

        </div>


        <div class="feature"
             onclick="showFeature('extras')">

          <div class="feature-icon">🎞️</div>

          <h3>Movie Extras</h3>

          <p>
            Behind-the-scenes material,
            interviews and bloopers.
          </p>

        </div>

      </section>


      <section class="difference">

        <div class="eyebrow">
          THE REELWISE DIFFERENCE
        </div>

        <h2>
          Stop searching for information.
          Start exploring movies.
        </h2>

        <p>
          A movie search should lead somewhere.
          Search for a film, meet its stars.
          Search for a star, discover their movies.
          Then follow the connections, quotes,
          stories and trivia wherever they take you.
        </p>

      </section>


      <section class="section">

        <div class="section-head">

          <div>
            <div class="eyebrow">
              FEATURED
            </div>

            <h2>
              Movies worth revisiting
            </h2>

            <div class="section-sub">
              Start somewhere. Then follow the rabbit hole.
            </div>
          </div>

        </div>


        <div class="movie-grid">

          ${FEATURED_MOVIES
            .slice(0,5)
            .map(movieCard)
            .join("")}

        </div>

      </section>


      <section class="section">

        <div class="section-head">

          <div>

            <div class="eyebrow">
              MORE TO EXPLORE
            </div>

            <h2>
              Your next movie rabbit hole
            </h2>

          </div>

        </div>

        <div class="movie-grid">

          ${FEATURED_MOVIES
            .slice(5)
            .map(movieCard)
            .join("")}

        </div>

      </section>

    </div>
  `;
}


/* =========================================================
   MOVIE CARD
========================================================= */

function movieCard(movie){

  return `

    <article
      class="card"
      onclick="openMovie('${movie.id}')"
    >

      <div class="poster">

        <span>
          ${movie.icon || "🎬"}<br>
          ${escapeHtml(movie.title)}
        </span>

      </div>

      <div class="info">

        <b>
          ${escapeHtml(movie.title)}
        </b>

        <small>
          ${movie.year || ""} ·
          ${escapeHtml(movie.genre || "")}
        </small>

      </div>

    </article>

  `;
}


/* =========================================================
   SEARCH
========================================================= */

async function searchMovies(query){

  query = String(query || "").trim();

  if(!query){

    home();
    return;
  }

  app.innerHTML = `

    <div class="wrap search-page">

      <div class="search-heading">

        <div class="eyebrow">
          REELWISE SEARCH
        </div>

        <h1>
          Searching…
        </h1>

        <p class="muted">
          Looking through movies and stars.
        </p>

      </div>

    </div>

  `;


  try{

    const response = await fetch(
      "/api/search?q=" +
      encodeURIComponent(query)
    );

    const data = await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Search failed."
      );

    }

    renderSearchResults(
      query,
      data
    );

  }catch(error){

    app.innerHTML = `

      <div class="wrap search-page">

        <div class="search-heading">

          <div class="eyebrow">
            SEARCH
          </div>

          <h1>
            Something went wrong.
          </h1>

          <p class="muted">
            ${escapeHtml(error.message)}
          </p>

        </div>

        <button
          class="primary"
          onclick="home()"
        >
          ← Back to Reelwise
        </button>

      </div>

    `;

  }

}


/* =========================================================
   SEARCH RESULTS

   IMPORTANT FIX:

   When searching for an ACTOR,
   we do NOT dump the actor's entire
   combined-credit list into the search results.

   The search result is the STAR.

   Their filmography is shown after
   clicking the star.

   This prevents the Sylvester Stallone
   problem we just saw.
========================================================= */

function renderSearchResults(query,data){

  const results =
    Array.isArray(data.results)
      ? data.results
      : [];


  const movies =
    results.filter(
      item => item.result_type === "movie"
    );


  const people =
    results.filter(
      item => item.result_type === "person"
    );


  app.innerHTML = `

    <div class="wrap search-page">

      <button
        class="back"
        onclick="home()"
        style="
          background:none;
          border:0;
          color:var(--muted);
          padding:0 0 20px;
        "
      >
        ← Back to Reelwise
      </button>


      <div class="search-heading">

        <div class="eyebrow">
          SEARCH RESULTS
        </div>

        <h1>
          ${escapeHtml(query)}
        </h1>

        <p class="muted">
          ${movies.length}
          movie${movies.length === 1 ? "" : "s"}
          ·
          ${people.length}
          star${people.length === 1 ? "" : "s"}
        </p>

      </div>


      ${
        movies.length
        ? `

          <section class="results-section">

            <div class="eyebrow">
              MOVIES
            </div>

            <h2>
              Movies
            </h2>

            <div class="result-movie-grid">

              ${movies
                .map(searchMovieCard)
                .join("")}

            </div>

          </section>

        `
        : ""
      }


      ${
        people.length
        ? `

          <section class="results-section">

            <div class="eyebrow">
              STARS

/* =========================================================
   PERSON PAGE

   FILMOGRAPHY IS NOW CLEAN.

   We intentionally prioritize
   recognizable acting/movie credits
   and remove the huge wall of obscure
   documentary-type entries that appeared
   in the Stallone search.
========================================================= */

function renderPerson(person){

  const combined =
    person.combined_credits || {};


  let credits =
    Array.isArray(combined.cast)
      ? combined.cast.slice()
      : [];


  credits =
    credits
      .filter(item =>
        item &&
        item.id &&
        (
          item.media_type === "movie" ||
          !item.media_type
        )
      )
      .filter(item =>
        item.title
      );


  const seen =
    new Set();


  credits =
    credits
      .filter(item => {

        const key =
          String(item.id);

        if(seen.has(key)){
          return false;
        }

        seen.add(key);
        return true;

      })
      .sort((a,b) => {

        const da =
          a.release_date ||
          "0000-00-00";

        const db =
          b.release_date ||
          "0000-00-00";

        return db.localeCompare(da);

      });


  const knownFor =
    credits
      .filter(item =>
        item.poster_path
      )
      .sort(
        (a,b) =>
          Number(b.popularity || 0) -
          Number(a.popularity || 0)
      )
      .slice(0,3);


  app.innerHTML = `

    <div class="wrap page">

      <button
        onclick="home()"
        style="
          background:none;
          border:0;
          color:var(--muted);
          padding:0 0 22px;
        "
      >
        ← Back
      </button>


      <section class="star-hero">

        <div class="eyebrow">
          REELWISE STAR
        </div>

        <h1>
          ${escapeHtml(
            person.name ||
            "Unknown"
          )}
        </h1>

        <div class="star-meta">
          ${escapeHtml(
            person.known_for_department ||
            "Actor"
          )}
        </div>

      </section>


      ${
        person.biography
        ? `

          <section class="star-section">

            <div class="detail-feature">

              <div class="eyebrow">
                THE STORY
              </div>

              <p class="detail-description">
                ${escapeHtml(
                  person.biography
                )}
              </p>

            </div>

          </section>

        `
        : ""
      }


      ${
        knownFor.length
        ? `

          <section class="star-section">

            <div class="eyebrow">
              KNOWN FOR
            </div>

            <h2>
              Known For
            </h2>

            <div class="movie-grid">

              ${knownFor
                .map(movieCard)
                .join("")}

            </div>

          </section>

        `
        : ""
      }


      <section class="star-section">

        <div class="eyebrow">
          THE MOVIES
        </div>

        <h2>
          Filmography
        </h2>

        <div class="filmography">

          ${
            credits
              .slice(0,30)
              .map(item => `

                <div
                  class="film"
                  onclick="openMovie('${item.id}')"
                  style="cursor:pointer"
                >

                  <b>
                    ${escapeHtml(
                      item.title
                    )}
                  </b>

                  <small>
                    ${
                      item.release_date
                        ? item.release_date.slice(0,4)
                        : "—"
                    }
                  </small>

                </div>

              `)
              .join("")
          }

        </div>

      </section>

    </div>

  `;

}

/* =========================================================
   MOVIE FEATURES

   These use the existing APIs we've built.
========================================================= */

async function openMovieFeature(id,feature){

  if(feature === "quotes"){

    await loadMovieFeature(
      id,
      "quotes",
      "/api/quotes?id="
    );

    return;

  }


  if(feature === "trivia"){

    await loadMovieFeature(
      id,
      "trivia",
      "/api/trivia?id="
    );

    return;

  }


  if(feature === "extras"){

    await loadMovieFeature(
      id,
      "extras",
      "/api/extras?id=" +
      encodeURIComponent(id) +
      "&feature=behind"
    );

  }

}


/* =========================================================
   LOAD MOVIE FEATURE
========================================================= */

async function loadMovieFeature(
  id,
  feature,
  baseUrl
){

  app.innerHTML = `

    <div class="wrap page">

      <div class="eyebrow">
        REELWISE ${feature.toUpperCase()}
      </div>

      <h1>
        Loading…
      </h1>

    </div>

  `;


  try{

    let url =
      baseUrl +
      encodeURIComponent(id);


    /*
      Extras already has the complete query.
    */

    if(feature === "extras"){

      url = baseUrl;

    }


    const response =
      await fetch(url);


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Content could not be loaded."
      );

    }


    renderFeature(
      feature,
      data
    );

  }catch(error){

    showError(
      error.message
    );

  }

}

/* =========================================================
   UTILITIES
========================================================= */

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeJs(value){

  return String(value || "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");
}
