<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reelwise — Know the Movie. Know the Story.</title>

<style>
:root{
  --bg:#080a0e;
  --panel:#10141b;
  --panel2:#151a22;
  --line:#262d38;
  --text:#f5f7fa;
  --muted:#9ca6b5;
  --accent:#ff5a36;
  --accentSoft:rgba(255,90,54,.14);
  --gold:#e4b34d;
  --goldSoft:rgba(228,179,77,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:
    radial-gradient(circle at 88% 2%,rgba(255,90,54,.10),transparent 26%),
    radial-gradient(circle at 8% 35%,rgba(228,179,77,.04),transparent 25%),
    linear-gradient(180deg,#0c1016 0,#080a0e 520px);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
header{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
header:after{content:"";position:absolute;inset:auto -120px -180px auto;width:420px;height:420px;border-radius:50%;background:rgba(255,90,54,.045);filter:blur(20px);pointer-events:none}
nav{position:relative;z-index:2;max-width:1160px;margin:auto;padding:18px 22px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:30px;font-weight:950;letter-spacing:-1.5px;cursor:pointer}
.logo span{color:var(--accent)}
.nav-links{display:flex;gap:7px;padding:5px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.025);border-radius:999px}
.nav-links button{background:none;border:0;color:#cbd1da;font-weight:750;padding:8px 13px;border-radius:999px}
.nav-links button:hover{color:white;background:rgba(255,255,255,.05)}
.hero{position:relative;z-index:1;max-width:1160px;margin:auto;padding:48px 22px 34px}
.hero-inner{max-width:790px}
.hero h1{max-width:790px;font-size:clamp(48px,7vw,80px);line-height:.96;letter-spacing:-4px;margin:12px 0 18px}
.hero h1 span{color:var(--accent)}
.hero p{color:#a8b0bc;font-size:18px;line-height:1.55;max-width:635px}
.eyebrow{color:var(--gold);font-weight:900;font-size:11px;letter-spacing:1.8px}
main{max-width:1160px;margin:auto;padding:35px 22px 75px}
.section-title{font-size:27px;margin:0 0 20px}
.home-intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}
.home-intro p{margin:0;color:var(--muted);font-size:13px}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.feature{position:relative;min-height:190px;overflow:hidden;background:radial-gradient(circle at 100% 0,rgba(255,90,54,.11),transparent 35%),linear-gradient(145deg,rgba(255,255,255,.035),transparent),#10151c;border:1px solid var(--line);border-radius:18px;padding:24px;cursor:pointer;transition:.22s ease;box-shadow:0 15px 40px rgba(0,0,0,.12)}
.feature:hover{transform:translateY(-3px);border-color:#414b58;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.feature:after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,var(--accent),var(--gold));opacity:.75}
.feature-number{position:absolute;right:18px;top:10px;color:rgba(255,255,255,.035);font-size:68px;font-weight:950;letter-spacing:-5px}
.feature-icon{position:relative;z-index:1;width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);font-size:25px;margin-bottom:17px}
.feature h3{position:relative;z-index:1;margin:0 0 8px;font-size:20px}
.feature p{position:relative;z-index:1;color:var(--muted);line-height:1.5;margin:0 0 15px}
.go{position:relative;z-index:1;color:var(--gold);font-size:13px;font-weight:850}
.home-spotlight{margin-top:39px;padding-top:31px;border-top:1px solid rgba(255,255,255,.065)}
.spotlight-heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px}
.spotlight-heading h2{margin:5px 0 0;font-size:24px}
.spotlight-heading span{color:var(--muted);font-size:12px}
#searchArea{display:none}
#results{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:18px}
.card{background:linear-gradient(180deg,#121720,#0e1218);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.18s ease;box-shadow:0 12px 30px rgba(0,0,0,.12)}
.card:hover{transform:translateY(-3px);border-color:#3f4957}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.no-poster{aspect-ratio:2/3;background:radial-gradient(circle at 50% 35%,#273244,#18202c);display:flex;align-items:center;justify-content:center;font-size:44px}
.card-info{padding:13px}
.card-info strong{display:block;margin:3px 0 5px}
.card-info small{color:var(--muted)}
.type{color:var(--gold);font-size:10px;font-weight:900;letter-spacing:1px}
.message{grid-column:1/-1;background:var(--panel);border:1px dashed #37404e;border-radius:14px;padding:35px;text-align:center;color:var(--muted)}
.discovery-page{grid-column:1/-1}
.discovery-hero{position:relative;overflow:hidden;background:radial-gradient(circle at 90% 10%,rgba(255,90,54,.17),transparent 30%),radial-gradient(circle at 70% 100%,rgba(228,179,77,.05),transparent 35%),linear-gradient(145deg,#151c26,#0c1016);border:1px solid var(--line);border-radius:22px;padding:34px;margin-bottom:35px;box-shadow:0 20px 55px rgba(0,0,0,.14)}
.discovery-hero:after{content:"REELWISE";position:absolute;right:-10px;bottom:-25px;font-size:95px;font-weight:950;letter-spacing:-8px;color:rgba(255,255,255,.018);pointer-events:none}
.discovery-hero h1{position:relative;z-index:1;font-size:clamp(38px,5vw,58px);line-height:1;letter-spacing:-2.5px;margin:8px 0 11px}
.discovery-hero p{position:relative;z-index:1;color:var(--muted);line-height:1.55;max-width:650px;margin:0}
.browse-section{margin:0 0 36px}
.browse-heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:13px}
.browse-heading h2{margin:4px 0 0;font-size:23px}
.browse-heading span{color:var(--muted);font-size:12px}
.visual-row{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 14px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.visual-card{flex:0 0 155px;background:#10141b;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.18s ease;box-shadow:0 10px 28px rgba(0,0,0,.13)}
.visual-card:hover{transform:translateY(-3px);border-color:#414b5a}
.visual-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.visual-info{padding:11px}
.visual-info strong{display:block;font-size:14px;line-height:1.3}
.visual-info small{display:block;color:var(--gold);margin-top:4px;font-size:11px;font-weight:800}
.detail{grid-column:1/-1}
.back-button{background:none;border:0;color:var(--muted);padding:0 0 22px;font-weight:750}
.back-button:hover{color:white}
.detail-layout{display:grid;grid-template-columns:260px 1fr;gap:37px;padding:28px;background:radial-gradient(circle at 88% 5%,rgba(255,90,54,.11),transparent 31%),linear-gradient(145deg,#131a24,#0c1016);border:1px solid var(--line);border-radius:22px;box-shadow:0 22px 65px rgba(0,0,0,.18)}
.detail-image{width:100%;border-radius:15px;display:block;box-shadow:0 18px 45px rgba(0,0,0,.32)}
.detail h1{font-size:clamp(38px,6vw,61px);line-height:1;letter-spacing:-2.5px;margin:6px 0 15px}
.detail p{color:#aab3c0;line-height:1.65}
.movie-facts{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0 20px}
.movie-fact{background:#11161e;border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:#dce2ea;font-size:12px;font-weight:750}
.movie-fact span{color:var(--gold)}
.cast{display:flex;flex-wrap:wrap;gap:8px}
.cast button{background:#151b24;border:1px solid #303846;color:white;border-radius:999px;padding:8px 12px;transition:.15s ease}
.cast button:hover{border-color:var(--accent);background:#1a202a}
.cast-toggle{margin-top:11px;background:none;border:0;color:var(--gold);font-weight:850;padding:0;font-size:13px}
.franchise-section{margin-top:28px;padding-top:28px;border-top:1px solid var(--line)}
.franchise-heading{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px}
.franchise-heading h2{font-size:27px;margin:5px 0 0}
.franchise-heading span{color:var(--muted);font-size:12px}
.franchise-row{display:flex;gap:11px;overflow-x:auto;padding:2px 1px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.franchise-card{flex:0 0 112px;background:#10141b;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.16s ease}
.franchise-card:hover{transform:translateY(-2px);border-color:#414b59}
.franchise-card.current{border-color:var(--gold);box-shadow:0 0 0 1px rgba(228,179,77,.2)}
.franchise-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.franchise-card .no-poster{font-size:28px}
.franchise-info{padding:9px}
.franchise-info strong{display:block;font-size:12px;line-height:1.25}
.franchise-info small{display:block;color:var(--gold);font-size:10px;font-weight:800;margin-top:4px}
.star-hero{display:grid;grid-template-columns:275px 1fr;gap:39px;padding:29px;background:radial-gradient(circle at 90% 5%,rgba(228,179,77,.08),transparent 30%),linear-gradient(145deg,#141b25,#0c1016);border:1px solid var(--line);border-radius:22px;box-shadow:0 22px 65px rgba(0,0,0,.18)}
.star-photo{width:100%;border-radius:15px;box-shadow:0 18px 45px rgba(0,0,0,.3)}
.star-name{font-size:clamp(42px,6vw,68px);line-height:.96;letter-spacing:-3px;margin:7px 0 8px}
.star-born{color:var(--gold);font-size:13px;font-weight:850;letter-spacing:.2px;margin:0 0 16px}
.star-bio{color:#b2bbc8;font-size:16px;line-height:1.7;max-width:720px}
.star-section{margin-top:36px;padding-top:3px}
.star-section h2{font-size:28px;margin:6px 0 16px}
.known-row{display:flex;gap:14px;overflow-x:auto;padding:2px 1px 12px}
.known-card{flex:0 0 145px;cursor:pointer}
.known-card img{width:145px;aspect-ratio:2/3;object-fit:cover;border-radius:11px;border:1px solid var(--line)}
.known-card strong{display:block;font-size:13px;margin-top:8px;line-height:1.3}
.known-card small{color:var(--muted)}
.movie-vault{margin-top:28px;padding-top:28px;border-top:1px solid var(--line)}
.movie-vault-heading{margin-bottom:18px}
.movie-vault-heading h2{font-size:34px;margin:5px 0 5px;letter-spacing:-1px}
.movie-vault-heading p{margin-top:0}
.movie-extras{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.extra-card{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.025),transparent),#11161e;border:1px solid var(--line);border-radius:14px;padding:16px;transition:.18s ease}
.extra-card:hover{transform:translateY(-2px);border-color:#404958}
.extra-card:after{content:"";position:absolute;left:0;bottom:0;width:100%;height:2px;background:var(--accent);opacity:.5}
.extra-icon{font-size:24px}
.extra-card h3{font-size:15px;margin:9px 0}
.extra-card button{background:none;border:0;padding:0;color:var(--gold);font-weight:850;font-size:12px}
.feature-view{background:linear-gradient(145deg,rgba(255,255,255,.018),transparent),var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:13px;padding:21px;margin-top:20px}
.feature-view h3{font-size:24px;margin:7px 0 0}
.fact-grid{display:grid;gap:12px;margin-top:16px}
.fact-item{background:#10141b;border:1px solid var(--line);border-radius:10px;padding:15px;line-height:1.5}
.video-list{display:grid;gap:14px;margin-top:16px}
.video-card{display:flex;gap:14px;align-items:center;background:#10141b;border:1px solid var(--line);border-radius:11px;padding:12px;text-decoration:none;color:white;transition:.15s ease}
.video-card:hover{border-color:#414b59}
.video-card img{width:120px;border-radius:7px}
.section-page{grid-column:1/-1}
.section-page > h1{font-size:clamp(36px,5vw,56px);letter-spacing:-2px;margin:8px 0 10px}
.section-page > p{color:var(--muted);line-height:1.6;max-width:670px}
.degree-box{margin-top:25px;background:radial-gradient(circle at 90% 0,rgba(255,90,54,.09),transparent 35%),var(--panel);border:1px solid var(--line);border-radius:17px;padding:27px;max-width:750px}
.degree-inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.degree-inputs input{flex:1;min-width:0;padding:15px 16px;border-radius:10px;border:1px solid #303846;background:#11161e;color:white;outline:none}
.degree-inputs input:focus{border-color:var(--accent)}
.degree-box button{border:0;background:linear-gradient(135deg,#ff6848,var(--accent));color:white;border-radius:10px;padding:14px 21px;font-weight:900;box-shadow:0 8px 25px rgba(255,90,54,.18)}
footer{border-top:1px solid var(--line);color:#737d8b;padding:26px;text-align:center}

/* Compact responsive layout */
@media(max-width:800px){
  nav{padding:12px 14px 8px;gap:8px}.logo{font-size:24px}.nav-links{gap:3px;padding:3px;margin-left:auto;overflow-x:auto;white-space:nowrap;max-width:calc(100vw - 118px);scrollbar-width:none}.nav-links::-webkit-scrollbar{display:none}.nav-links button{font-size:10px;padding:7px 8px}
  .hero{padding:21px 18px 17px}.hero h1{font-size:41px;line-height:1;letter-spacing:-2.2px;margin:8px 0 11px}.hero p{font-size:14px;line-height:1.5;margin:0}
  main{padding:16px 14px 45px}.home-intro{margin-bottom:12px}.home-intro p{display:none}.section-title{font-size:13px;text-transform:uppercase;letter-spacing:1.3px;color:var(--gold)}
  .features{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.feature{min-height:auto;padding:13px 5px 14px;text-align:center;border-radius:13px}.feature-number{display:none}.feature-icon{width:36px;height:36px;margin:0 auto 7px;font-size:19px;border-radius:9px}.feature h3{font-size:12px;margin:0}.feature p,.feature .go{display:none}
  .home-spotlight{margin-top:25px;padding-top:22px}.spotlight-heading h2{font-size:20px}.spotlight-heading span{display:none}
  .discovery-hero{padding:19px;border-radius:16px;margin-bottom:26px}.discovery-hero:after{display:none}.discovery-hero h1{font-size:32px;letter-spacing:-1.2px}.discovery-hero p{font-size:13px}
  .browse-section{margin-bottom:28px}.browse-heading h2{font-size:20px}.browse-heading span{display:none}.visual-row{gap:10px}.visual-card{flex-basis:122px;border-radius:11px}.visual-info{padding:9px}.visual-info strong{font-size:12px}
  #results{grid-template-columns:repeat(2,1fr);gap:11px}.card-info{padding:10px}.card-info strong{font-size:13px}
  .movie-extras{display:flex;overflow-x:auto;gap:8px}.extra-card{flex:0 0 112px}
  .degree-inputs{grid-template-columns:1fr}.degree-box{padding:18px}
}

/* Vault polish */
.feature-view{margin-top:24px;padding:22px;border-radius:16px;background:radial-gradient(circle at 100% 0,rgba(228,179,77,.055),transparent 34%),linear-gradient(145deg,rgba(255,255,255,.02),transparent),var(--panel2);box-shadow:0 16px 38px rgba(0,0,0,.16)}
.feature-view > .eyebrow{margin-bottom:7px}.feature-view h3{margin:0;font-size:27px;letter-spacing:-.5px}.feature-view .fact-grid{display:grid;gap:10px;margin-top:18px}
.feature-view .fact-item{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.018),transparent),#10141b;border:1px solid #2b3340;border-radius:12px;padding:15px 17px;color:#edf1f6;font-size:15px;line-height:1.58;box-shadow:0 7px 18px rgba(0,0,0,.08)}
.feature-view .fact-item:before{content:"";position:absolute;left:-1px;top:13px;bottom:13px;width:2px;border-radius:2px;background:linear-gradient(180deg,var(--gold),var(--accent));opacity:.8}
.feature-view .fact-item strong{color:var(--gold)}

/* Six Degrees */
.section-page.six-page{max-width:820px;margin:0 auto;padding-top:10px}
.six-page > h1{max-width:760px;font-size:clamp(42px,6vw,66px);line-height:.98;letter-spacing:-3px;margin:10px 0 14px}
.six-page > p{max-width:650px;font-size:17px}
.six-page .degree-box{max-width:none;margin-top:28px;padding:28px;border-radius:20px}
.six-result{margin-top:22px;padding:20px;border:1px solid #313a47;border-left:4px solid var(--accent);border-radius:15px;background:linear-gradient(145deg,#161c25,#10151c)}
.six-result-title{color:var(--gold);font-size:20px;font-weight:900;margin-bottom:16px}
.six-story{margin:0 0 16px;color:#d8dee7;font-size:14px;line-height:1.55}
.six-visual-path{display:grid;gap:12px}
.six-actor-card{display:flex;align-items:center;gap:11px;min-height:54px;padding:8px 10px;border:1px solid rgba(255,255,255,.07);border-radius:12px;background:rgba(255,255,255,.025)}
.six-actor-photo,.six-actor-fallback{width:38px;height:38px;border-radius:50%;flex:0 0 38px}
.six-actor-photo{object-fit:cover;border:1px solid #394352}.six-actor-fallback{display:flex;align-items:center;justify-content:center;background:#171d26;border:1px solid #394352}
.six-actor-name{font-weight:900;font-size:16px}
.six-movie-card{display:grid;grid-template-columns:72px 1fr;gap:13px;align-items:center;margin-left:18px;padding:10px;border:1px solid #303947;border-radius:13px;background:#11161e}
.six-movie-poster,.six-movie-poster-fallback{width:72px;aspect-ratio:2/3;border-radius:8px}.six-movie-poster{object-fit:cover}.six-movie-poster-fallback{display:flex;align-items:center;justify-content:center;background:#1b222c;font-size:25px}
.six-movie-label{color:var(--gold);font-size:10px;font-weight:900;letter-spacing:1.1px}.six-movie-title{font-size:17px;font-weight:900}.six-movie-year{color:var(--muted);font-size:12px;margin-top:4px}.six-link-line{width:2px;height:12px;margin:-2px 0 -2px 35px;background:linear-gradient(var(--gold),var(--accent));opacity:.75}
.six-actor-card.clickable,.six-movie-card.clickable{cursor:pointer}

/* Movie hero */
.movie-hero{position:relative;overflow:hidden;isolation:isolate;grid-template-columns:270px minmax(0,1fr);gap:40px;padding:32px;background:linear-gradient(145deg,#131a24,#0c1016)}
.movie-hero:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(10,13,18,.98),rgba(10,13,18,.82),rgba(10,13,18,.92));pointer-events:none}
.movie-backdrop{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center 25%;filter:saturate(.85);opacity:.5;transform:scale(1.015)}
.movie-poster-wrap{position:relative;align-self:start}.movie-info{min-width:0;align-self:center}.movie-head h1{max-width:760px;margin:0 0 14px;font-size:clamp(42px,6vw,68px);line-height:.94;letter-spacing:-3px}
.movie-overview-label{margin:20px 0 6px;color:var(--gold);font-size:10px;font-weight:900;letter-spacing:1.45px}.movie-overview{max-width:780px;margin:0;color:#c1c8d2!important;font-size:16px;line-height:1.68!important}
.movie-cast-block{padding-top:18px;border-top:1px solid rgba(255,255,255,.09)}.movie-cast-heading{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:11px}.movie-cast-heading h2{margin:4px 0 0;font-size:22px}.movie-cast-heading span{color:var(--muted);font-size:11px}

/* Discovery search */
.discovery-search{display:flex;gap:9px;max-width:620px;margin-top:20px;padding:6px;border:1px solid rgba(255,255,255,.08);background:rgba(15,20,27,.82);border-radius:13px;position:relative;overflow:visible}
.discovery-search input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:white;padding:12px 11px}.discovery-search button{border:0;border-radius:9px;padding:11px 15px;font-weight:900;color:white;background:linear-gradient(135deg,#ff6848,var(--accent))}

/* Filmography */
.filmography-groups{display:grid;gap:22px}.filmography-group{min-width:0}.filmography-group-heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:9px}.filmography-group-heading h3{margin:0;font-size:19px}.filmography-group-heading span{color:var(--muted);font-size:11px}
.filmography.compact{display:flex;gap:10px;overflow-x:auto;padding:1px 1px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}.filmography-card{background:linear-gradient(180deg,#121720,#0d1117);border:1px solid var(--line);border-radius:9px;overflow:hidden;cursor:pointer;flex:0 0 92px}.filmography-card img,.filmography-card .no-poster{width:92px;aspect-ratio:2/3;object-fit:cover}.filmography-card-info{padding:7px}.filmography-card-info strong{display:block;font-size:10px;line-height:1.2}.filmography-card-info small{display:block;color:var(--gold);font-size:9px;margin-top:3px}
.star-bio.collapsed{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}

/* REELWISE PREDICTIVE SEARCH — FULL RESTORE */
const reelwisePredictState=new WeakMap();

function rwClean(value){
  return String(value||"").toLowerCase().replace(/[’']/g,"").replace(/&/g," and ")
    .replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
}
function rwEditDistance(a,b){
  a=rwClean(a);b=rwClean(b);
  const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return dp[m][n];
}
function rwSimilarity(a,b){
  a=rwClean(a);b=rwClean(b);
  if(!a||!b)return 0;
  if(a===b)return 1;
  if(b.startsWith(a))return .98;
  if(a.startsWith(b))return .93;
  if(b.includes(a))return .90;
  return 1-rwEditDistance(a,b)/Math.max(a.length,b.length,1);
}
function predictorConfig(input){
  if(!input)return {type:"all",selectOnly:false};
  if(input.id==="movieDiscoverySearch")return {type:"movie",selectOnly:false};
  if(input.id==="starDiscoverySearch")return {type:"person",selectOnly:false};
  if(input.id==="actorOne"||input.id==="actorTwo")return {type:"person",selectOnly:true};
  return {type:"all",selectOnly:false};
}
function suggestionBoxFor(input){
  if(!input)return null;
  const parent=input.parentElement;
  let box=Array.from(parent.children).find(el=>el.classList&&el.classList.contains("reelwise-suggestions"));
  if(!box){
    box=document.createElement("div");
    box.className="reelwise-suggestions";
    box.setAttribute("role","listbox");
    parent.appendChild(box);
  }
  return box;
}
function closeSuggestions(input){
  if(!input||!input.parentElement)return;
  const box=Array.from(input.parentElement.children).find(el=>el.classList&&el.classList.contains("reelwise-suggestions"));
  if(box){box.classList.remove("open");box.innerHTML=""}
}
async function rwSearch(q,signal){
  const response=await fetch("/api/search?q="+encodeURIComponent(q),{signal});
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"Search failed.");
  return Array.isArray(data.results)?data.results:[];
}
function predictionScore(query,item){
  const name=item.display_title||item.title||item.name||"",q=rwClean(query),n=rwClean(name);
  let score=rwSimilarity(q,n);
  const qWords=q.split(" ").filter(Boolean),nWords=n.split(" ").filter(Boolean);
  if(qWords.length>1&&nWords.length){
    const scores=qWords.map(qw=>Math.max(...nWords.map(nw=>rwSimilarity(qw,nw))));
    score=score*.38+(scores.reduce((a,b)=>a+b,0)/scores.length)*.47+Math.min(...scores)*.15;
  }
  return score;
}
async function loadPredictions(input){
  const raw=String(input.value||"").trim(),box=suggestionBoxFor(input);
  if(!box)return;
  input.dataset.tmdbId="";
  input.dataset.tmdbType="";
  if(raw.length<3){closeSuggestions(input);return}

  let state=reelwisePredictState.get(input);
  if(!state){
    state={timer:null,controller:null};
    reelwisePredictState.set(input,state);
  }
  clearTimeout(state.timer);

  state.timer=setTimeout(async()=>{
    try{
      if(state.controller)state.controller.abort();
      state.controller=new AbortController();
      const signal=state.controller.signal,config=predictorConfig(input),normalized=normalizeReelwiseQuery(raw);
      let items;

      if(config.type==="movie"){
        const response=await fetch("/api/search?type=movie&q="+encodeURIComponent(normalized),{signal});
        const data=await response.json();
        if(!response.ok)throw new Error(data.error||"Movie search failed.");
        items=Array.isArray(data.results)?data.results:[];
        if(!items.length)items=await rwSearch(normalized,signal);
      }else{
        items=await rwSearch(normalized,signal);
      }

      const words=rwClean(raw).split(" ").filter(Boolean);

      if(words.length>1){
        for(const word of [...words].filter(w=>w.length>=2).sort((a,b)=>b.length-a.length).slice(0,2)){
          let extra;
          if(config.type==="movie"){
            const extraResponse=await fetch("/api/search?type=movie&q="+encodeURIComponent(word),{signal});
            const extraData=await extraResponse.json();
            extra=extraResponse.ok&&Array.isArray(extraData.results)?extraData.results:[];
            if(!extra.length)extra=await rwSearch(word,signal);
          }else{
            extra=await rwSearch(word,signal);
          }
          const seen=new Set(items.map(x=>x.result_type+":"+x.id));
          extra.forEach(x=>{
            const k=x.result_type+":"+x.id;
            if(!seen.has(k)){seen.add(k);items.push(x)}
          });
        }
      }

      if(config.type!=="all")items=items.filter(item=>item.result_type===config.type);

      if(config.type==="movie"&&rwClean(normalized).length<=4){
        const broad=await rwSearch(normalized,signal);
        const seen=new Set(items.map(x=>x.result_type+":"+x.id));
        broad.filter(x=>x.result_type==="movie").forEach(x=>{
          const k=x.result_type+":"+x.id;
          if(!seen.has(k)){seen.add(k);items.push(x)}
        });
      }

      const cleanQuery=rwClean(normalized);
      const threshold=words.length>1?.56:(config.type==="movie"&&cleanQuery.length<=4?.50:.70);

      const ranked=items.map(item=>{
        let score=predictionScore(normalized,item);
        const name=rwClean(item.display_title||item.title||item.name||"");
        if(config.type==="movie"&&cleanQuery.length<=4){
          const titleWords=name.split(" ").filter(Boolean);
          if(name.startsWith(cleanQuery))score=Math.max(score,.995);
          else if(titleWords.some(word=>word.startsWith(cleanQuery)))score=Math.max(score,.94);
        }
        return {item,score};
      }).filter(x=>x.score>=threshold).sort((a,b)=>b.score-a.score).slice(0,5);

      if(!ranked.length){closeSuggestions(input);return}

      const suggestions=ranked.map(x=>x.item);

      box.innerHTML=suggestions.map((item,index)=>{
        const movie=item.result_type==="movie",
          name=item.display_title||item.title||item.name||"Unknown",
          image=movie?item.poster_path:item.profile_path,
          imageURL=image?"https://image.tmdb.org/t/p/w185"+image:"",
          meta=movie?(item.year||"Movie"):(item.known_for_department||"Movie Star");

        return `<button type="button" class="suggestion-item" role="option" data-index="${index}">${imageURL?`<img class="suggestion-thumb" src="${imageURL}" alt="">`:`<span class="suggestion-fallback">${movie?"🎬":"⭐"}</span>`}<span class="suggestion-copy"><span class="suggestion-type">${movie?"MOVIE":"STAR"}</span><strong>${escapeHTML(name)}</strong><small>${escapeHTML(meta)}</small></span></button>`;
      }).join("");

      box.querySelectorAll(".suggestion-item").forEach((button,index)=>{
        button.addEventListener("click",event=>{
          event.preventDefault();
          event.stopPropagation();
          const item=suggestions[index],name=item.display_title||item.title||item.name||raw;
          input.value=name;
          input.dataset.tmdbId=String(item.id||"");
          input.dataset.tmdbType=item.result_type||"";
          closeSuggestions(input);

          if(config.selectOnly){
            input.dispatchEvent(new Event("change",{bubbles:true}));
            return;
          }
          item.result_type==="movie"?showMovie(item.id):showPerson(item.id);
        });
      });

      box.classList.add("open");
    }catch(error){
      if(error.name!=="AbortError")closeSuggestions(input);
    }
  },220);
}
function wirePredictiveInput(input){
  if(!input||input.dataset.predictive==="true")return;
  input.dataset.predictive="true";
  input.setAttribute("autocomplete","off");
  input.addEventListener("input",()=>loadPredictions(input));
  input.addEventListener("focus",()=>{if(input.value.trim().length>=3)loadPredictions(input)});
  input.addEventListener("keydown",event=>{if(event.key==="Escape")closeSuggestions(input)});
}
function wireAllPredictiveSearches(){
  ["movieDiscoverySearch","starDiscoverySearch","actorOne","actorTwo"].forEach(id=>wirePredictiveInput(document.getElementById(id)));
}
document.addEventListener("click",event=>{
  document.querySelectorAll(".reelwise-suggestions.open").forEach(box=>{
    if(!box.parentElement.contains(event.target)){
      box.classList.remove("open");
      box.innerHTML="";
    }
  });
});
const reelwiseObserver=new MutationObserver(()=>wireAllPredictiveSearches());
reelwiseObserver.observe(document.body,{childList:true,subtree:true});
wireAllPredictiveSearches();

loadHomeMovies();
</script>
